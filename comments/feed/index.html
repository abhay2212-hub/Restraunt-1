<script>
// Lazyload fix - swap data-src to src for images
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('img[data-src]').forEach(function(img) {
        if (img.dataset.src && !img.dataset.src.startsWith('data:')) {
            img.src = img.dataset.src;
            img.classList.remove('lazyload');
            img.classList.add('lazyloaded');
        }
        if (img.dataset.srcset) { img.srcset = img.dataset.srcset; }
        if (img.dataset.sizes) { img.sizes = img.dataset.sizes; }
    });
    document.querySelectorAll('[data-bg-image]').forEach(function(el) {
        var bgUrl = el.dataset.bgImage;
        if (bgUrl) {
            el.style.backgroundImage = bgUrl;
            el.classList.remove('lazyload');
            el.classList.add('lazyloaded');
        }
    });
    document.querySelectorAll('.lazyload').forEach(function(el) {
        el.classList.remove('lazyload');
        el.classList.add('lazyloaded');
    });
});
</script>
